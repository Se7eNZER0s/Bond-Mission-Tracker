<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bond Mission Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px 10px 28px;background:#f7f7f8;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.wrap{max-width:900px;margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:3px 0 10px}
h1{font-size:20px;margin:0}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit}.action,.reset{font-size:11px;padding:7px 8px;border:1px solid #aaa;border-radius:8px;background:#fff;color:#222}.action.active{background:#222;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card{position:relative;display:flex;flex-direction:column;min-height:132px;padding:9px;border:1px solid #cfcfcf;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pairtext{flex:1;min-width:0;padding:1px 22px 0 4px}.name{font-size:11px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}.ach{font-size:9px;color:#777;min-height:11px;margin-top:3px}
.toggle-row{display:flex;gap:6px;margin-top:8px}.toggle,.bonded{display:flex;align-items:center;justify-content:center;border:1px solid #aaa;border-radius:8px;background:#fafafa;cursor:pointer;user-select:none;font-size:11px;font-weight:600}.toggle{flex:1;height:36px}.toggle input,.bonded input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.b1:has(input:checked){background:#dff7f3;border-color:#0f9d8a;color:#08796b}.b2:has(input:checked){background:#fff0df;border-color:#f28c28;color:#b85d00}
.bonded-row{margin-top:6px}.bonded{width:100%;height:30px;font-size:10px}.bonded:has(input:checked){background:#fff7cc;border-color:#d6a800;color:#876800}
.hide-btn{position:absolute;top:5px;right:5px;border:0;background:transparent;color:#888;font-size:10px;padding:3px}
.version{text-align:center;color:#999;font-size:9px;margin-top:12px;letter-spacing:.3px}.add-panel{display:none;margin-bottom:9px;padding:8px;border:1px solid #ccc;border-radius:10px;background:#fff}.add-panel.open{display:block}.add-title{font-size:11px;font-weight:700;margin-bottom:6px}.hidden-list{display:flex;flex-wrap:wrap;gap:5px}.add-item{font-size:10px;padding:6px 8px;border:1px solid #bbb;border-radius:7px;background:#fafafa}
.editing .card{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.editing .card *{user-select:none;-webkit-user-select:none}.card.dragging{position:fixed!important;margin:0!important;opacity:1;transform:scale(1.06);box-shadow:0 20px 45px rgba(0,0,0,.30),0 0 0 2px rgba(15,157,138,.4);z-index:1000;cursor:grabbing;pointer-events:none;transition:none}.card.dragging:after{content:"MOVE";position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:800;letter-spacing:.9px;padding:3px 7px;border-radius:6px;background:#222;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);pointer-events:none}.drag-placeholder{border:2px dashed #0f9d8a;border-radius:10px;background:#e9faf7;min-height:132px;box-shadow:inset 0 0 0 1px rgba(15,157,138,.08)}.card.drop-target{border:2px dashed #555;padding:8px}
@media(max-width:520px){.header{align-items:flex-start}h1{font-size:18px}.actions{max-width:65%}.action,.reset{font-size:10px;padding:6px}.grid{gap:6px}.card{min-height:132px;padding:8px}.name{font-size:10px}.toggle{height:34px;font-size:10px}.bonded{height:29px;font-size:9px}}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><h1>Bond Mission Tracker</h1><div class="actions">
<button class="action" id="addBtn" type="button">Add Pair</button>
<button class="action" id="editBtn" type="button">Edit Position</button>
<button class="reset" id="resetBtn" type="button">Reset Mission</button>
</div></div>
<div class="add-panel" id="addPanel"><div class="add-title">Hidden Pairs — tap a pair to show it</div><div class="hidden-list" id="hiddenList"></div></div>
<div class="grid" id="grid"></div>\n<div class="version">Version 1.5</div>
</div>
<script>
(()=>{
const pairs=[
["Hawks ↔ Trick","Old Friends"],["Hawks ↔ Luco Bronc","Sharp Shooters"],["Hawks ↔ Kabb Uppercut","Mate and Marrow"],["Hawks ↔ Jae Mordant","Class and Distinction"],["Trick ↔ Luco Bronc","Heroes on Both Sides"],["Kabb Uppercut ↔ Jae Mordant","The Baroness and the Boxer"],
["Custom Operator 1 ↔ Hawks",""],["Custom Operator 1 ↔ Trick",""],["Custom Operator 1 ↔ Luco Bronc",""],["Custom Operator 1 ↔ Kabb Uppercut",""],["Custom Operator 1 ↔ Jae Mordant",""],["Custom Operator 1 ↔ BR-1 Astromech",""],["Custom Operator 1 ↔ Astromech 2",""],
["BR-1 Astromech ↔ Hawks",""],["BR-1 Astromech ↔ Trick",""],["BR-1 Astromech ↔ Luco Bronc",""],["BR-1 Astromech ↔ Kabb Uppercut",""],["BR-1 Astromech ↔ Jae Mordant",""],
["Astromech 2 ↔ Hawks",""],["Astromech 2 ↔ Trick",""],["Astromech 2 ↔ Luco Bronc",""],["Astromech 2 ↔ Kabb Uppercut",""],["Astromech 2 ↔ Jae Mordant",""]
];
const grid=document.getElementById("grid"),KEY="bondMissionTrackerV6";
pairs.forEach((p,i)=>{grid.insertAdjacentHTML("beforeend",`<div class="card" data-id="${i}">
<div class="pairtext"><div class="name">${p[0]}</div><div class="ach">${p[1]}</div></div>
<div class="toggle-row"><label class="toggle b1"><input class="backup-check" data-type="b1" type="checkbox"><span>B1</span></label><label class="toggle b2"><input class="backup-check" data-type="b2" type="checkbox"><span>B2</span></label></div>
<div class="bonded-row"><label class="bonded"><input class="bonded-check" type="checkbox"><span>Fully Bonded</span></label></div>
<button class="hide-btn" type="button">Hide</button></div>`)});
let hidden=[],dragId=null;
const addBtn=document.getElementById("addBtn"),addPanel=document.getElementById("addPanel"),hiddenList=document.getElementById("hiddenList"),editBtn=document.getElementById("editBtn"),savePosBtn=document.getElementById("savePosBtn"),resetBtn=document.getElementById("resetBtn");
function save(){const state={order:[...grid.children].map(c=>+c.dataset.id),hidden,checks:Object.fromEntries([...grid.children].map(c=>[c.dataset.id,{b1:c.querySelector('[data-type="b1"]').checked,b2:c.querySelector('[data-type="b2"]').checked,f:c.querySelector(".bonded-check").checked}]))};try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(!x)return;hidden=x.hidden||[];const m=new Map([...grid.children].map(c=>[+c.dataset.id,c]));(x.order||[]).forEach(id=>m.has(id)&&grid.appendChild(m.get(id)));Object.entries(x.checks||{}).forEach(([id,v])=>{const c=m.get(+id);if(c){c.querySelector('[data-type="b1"]').checked=!!v.b1;c.querySelector('[data-type="b2"]').checked=!!v.b2;c.querySelector(".bonded-check").checked=!!v.f}})}catch(e){}}
function render(){const hs=new Set(hidden);[...grid.children].forEach(c=>c.style.display=hs.has(+c.dataset.id)?"none":"");hiddenList.innerHTML="";if(!hidden.length){hiddenList.textContent="No hidden pairs";return}hidden.forEach(id=>{const c=grid.querySelector('.card[data-id="'+id+'"]');if(!c)return;const b=document.createElement("button");b.className="add-item";b.type="button";b.textContent=c.querySelector(".name").textContent;b.onclick=()=>{hidden=hidden.filter(x=>x!==id);render();save()};hiddenList.appendChild(b)})}
function setEditing(on){document.body.classList.toggle("editing",on);editBtn.classList.toggle("active",on);editBtn.textContent=on?"Done Editing":"Edit Position";if(on){document.body.style.userSelect="none";document.body.style.webkitUserSelect="none"}else{document.body.style.userSelect="";document.body.style.webkitUserSelect=""}}
addBtn.onclick=()=>{addPanel.classList.toggle("open");addBtn.classList.toggle("active",addPanel.classList.contains("open"))};
editBtn.onclick=()=>{const on=!document.body.classList.contains("editing");setEditing(on);if(!on)save()};

grid.addEventListener("click",e=>{const b=e.target.closest(".hide-btn");if(b){const id=+b.closest(".card").dataset.id;if(!hidden.includes(id))hidden.push(id);render();save()}});

grid.addEventListener("change",save);

let pointerCard=null,pointerId=null,dragging=false,lastY=0,holdTimer=null,dragOffsetX=0,dragOffsetY=0,placeholder=null;
function positionDragged(x,y){
  if(!pointerCard)return;
  pointerCard.style.left=(x-dragOffsetX)+"px";
  pointerCard.style.top=(y-dragOffsetY)+"px";
}
function movePlaceholder(x,y){
  if(!placeholder)return;
  const cards=[...grid.querySelectorAll(".card")].filter(c=>c!==pointerCard&&c.style.display!=="none");
  let target=null;
  for(const c of cards){
    const r=c.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){target=c;break}
  }
  if(!target){
    let best=null,bestD=Infinity;
    for(const c of cards){
      const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=(x-cx)**2+(y-cy)**2;
      if(d<bestD){bestD=d;best=c}
    }
    target=best;
  }
  if(target){
    const r=target.getBoundingClientRect();
    if(y<r.top+r.height/2 || (Math.abs(y-(r.top+r.height/2))<r.height*.2 && x<r.left+r.width/2)) grid.insertBefore(placeholder,target);
    else grid.insertBefore(placeholder,target.nextSibling);
  }else grid.appendChild(placeholder);
}
function beginDrag(){
  if(!pointerCard||dragging)return;
  dragging=true;
  const r=pointerCard.getBoundingClientRect();
  placeholder=document.createElement("div");
  placeholder.className="drag-placeholder";
  placeholder.style.height=r.height+"px";
  placeholder.style.width=r.width+"px";
  grid.insertBefore(placeholder,pointerCard);
  pointerCard.classList.add("dragging");
  pointerCard.style.width=r.width+"px";
  pointerCard.style.height=r.height+"px";
  positionDragged(lastX,lastY);
  navigator.vibrate?.(25);
}
let lastX=0;
grid.addEventListener("pointerdown",e=>{
  if(!document.body.classList.contains("editing")||e.target.closest("button,label"))return;
  const c=e.target.closest(".card");if(!c||c.style.display==="none")return;
  pointerCard=c;pointerId=e.pointerId;lastX=e.clientX;lastY=e.clientY;dragging=false;
  const r=c.getBoundingClientRect();dragOffsetX=e.clientX-r.left;dragOffsetY=e.clientY-r.top;
  c.setPointerCapture?.(pointerId);
  holdTimer=setTimeout(beginDrag,180);
  e.preventDefault();
});
grid.addEventListener("pointermove",e=>{
  if(!pointerCard||e.pointerId!==pointerId)return;
  lastX=e.clientX;lastY=e.clientY;
  e.preventDefault();
  if(!dragging && (Math.abs(e.clientX-(pointerCard.getBoundingClientRect().left+dragOffsetX))>7 || Math.abs(e.clientY-(pointerCard.getBoundingClientRect().top+dragOffsetY))>7)){
    clearTimeout(holdTimer);beginDrag();
  }
  if(dragging){positionDragged(e.clientX,e.clientY);movePlaceholder(e.clientX,e.clientY)}
});
function finishDrag(e){
  if(!pointerCard||e.pointerId!==pointerId)return;
  e.preventDefault();clearTimeout(holdTimer);
  if(dragging){
    pointerCard.classList.remove("dragging");
    pointerCard.style.position="";pointerCard.style.left="";pointerCard.style.top="";pointerCard.style.width="";pointerCard.style.height="";
    if(placeholder){grid.insertBefore(pointerCard,placeholder);placeholder.remove();placeholder=null}
    save();
  }
  pointerCard.releasePointerCapture?.(pointerId);
  pointerCard=null;pointerId=null;dragging=false;
}
grid.addEventListener("pointerup",finishDrag);
grid.addEventListener("pointercancel",finishDrag);
grid.addEventListener("lostpointercapture",()=>{
  clearTimeout(holdTimer);
  if(pointerCard&&dragging){
    pointerCard.classList.remove("dragging");
    pointerCard.style.position="";pointerCard.style.left="";pointerCard.style.top="";pointerCard.style.width="";pointerCard.style.height="";
    if(placeholder){grid.insertBefore(pointerCard,placeholder);placeholder.remove();placeholder=null}
    save();
  }
  pointerCard=null;pointerId=null;dragging=false;
});
resetBtn.onclick=()=>{grid.querySelectorAll(".backup-check,.bonded-check").forEach(x=>x.checked=false);save()};
load();render();
})();
</script>
</body>
</html>
